<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXBUS_LIVE - Where Is My Bus</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#111722] min-h-screen relative overflow-hidden font-sans antialiased text-slate-100">

  <!-- Interactive Leaflet Map -->
  <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

  <!-- Top Search & Status Header -->
  <header class="relative z-20 w-full pt-3 px-3 flex flex-col items-center gap-2 pointer-events-none">
    
    <!-- Active Trip Banner -->
    <div id="activeTripBar" class="hidden pointer-events-auto flex flex-wrap items-center justify-between w-full max-w-2xl bg-[#1a2232]/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700 text-xs gap-2 transition-all duration-300">
      <div class="flex items-center gap-2 flex-1 min-w-[200px]">
        <span class="text-sky-400 font-bold uppercase text-[10px] tracking-wider shrink-0 bg-sky-950/70 border border-sky-800 px-2 py-0.5 rounded-md">TRIP</span>
        <span id="currentDirectionLabel" class="text-white font-extrabold text-sm whitespace-normal break-words leading-tight">--</span>
      </div>
      <div class="flex items-center gap-2 shrink-0 ml-auto">
        <div id="tripStatsPill" class="hidden px-2.5 py-1 rounded-full font-bold bg-slate-800 text-sky-400 border border-slate-700 flex items-center gap-1.5 shadow-sm">
          <i data-lucide="navigation-2" class="w-3 h-3"></i>
          <span id="tripDistText">-- km</span> • <span id="tripDurationText">-- mins</span>
        </div>
        <span id="connBadge" class="px-2.5 py-1 rounded-full font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-800 shadow-sm flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Live</span>
        </span>
      </div>
    </div>

    <!-- Search Controls -->
    <div class="pointer-events-auto w-full max-w-2xl bg-[#1a2232]/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 p-3 transition-all duration-200">
      <div class="flex flex-col sm:flex-row items-stretch gap-2 relative">
        
        <!-- Pickup Input -->
        <div class="relative w-full">
          <div class="flex items-center bg-[#111722] hover:bg-[#151c2a] focus-within:bg-[#111722] rounded-xl border border-slate-700 focus-within:border-emerald-500 transition-all">
            <div class="pl-3.5 pr-2 py-3 flex items-center text-emerald-400">
              <i data-lucide="circle-dot" class="w-4 h-4"></i>
            </div>
            <input
              id="pickup-input"
              type="text"
              autocomplete="off"
              placeholder="Boarding Stop"
              class="w-full bg-transparent py-2.5 text-sm text-white placeholder-slate-400 font-medium focus:outline-none"
            />
            <button id="pickup-clear" onclick="clearInput('pickup')" class="hidden pr-3 text-slate-400 hover:text-slate-200">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <ul id="pickup-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-[#1a2232] rounded-xl shadow-2xl border border-slate-700 max-h-56 overflow-y-auto custom-scrollbar z-50 divide-y divide-slate-800"></ul>
        </div>

        <!-- Rotate / Swap Button -->
        <div class="flex items-center justify-center">
          <button
            id="swapBtn"
            type="button"
            onclick="swapPickupAndDestination()"
            title="Swap Pickup and Destination"
            class="p-2.5 rounded-xl text-slate-400 hover:text-emerald-400 hover:bg-slate-800 active:scale-95 transition-all duration-300 border border-slate-700 group"
          >
            <i data-lucide="arrow-up-down" id="swapIcon" class="w-4 h-4 transition-transform duration-300 group-hover:rotate-180"></i>
          </button>
        </div>

        <!-- Destination Input -->
        <div class="relative w-full">
          <div class="flex items-center bg-[#111722] hover:bg-[#151c2a] focus-within:bg-[#111722] rounded-xl border border-slate-700 focus-within:border-rose-500 transition-all">
            <div class="pl-3.5 pr-2 py-3 flex items-center text-rose-400">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <input
              id="dest-input"
              type="text"
              autocomplete="off"
              placeholder="Deboarding Destination"
              class="w-full bg-transparent py-2.5 text-sm text-white placeholder-slate-400 font-medium focus:outline-none"
            />
            <button id="dest-clear" onclick="clearInput('dest')" class="hidden pr-3 text-slate-400 hover:text-slate-200">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <ul id="dest-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-[#1a2232] rounded-xl shadow-2xl border border-slate-700 max-h-56 overflow-y-auto custom-scrollbar z-50 divide-y divide-slate-800"></ul>
        </div>

        <!-- Search Button -->
        <button onclick="handleSearchClick()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-600/20 shrink-0 transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Find Buses</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Live Bus Status Floating Card -->
  <div id="floatingBusCard" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-full max-w-md px-4 pointer-events-none transition-all duration-300">
    <div class="pointer-events-auto bg-[#1a2232]/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="toggleBottomSheet()">
        <div class="w-10 h-10 rounded-xl bg-sky-600 text-white flex items-center justify-center shadow-md shadow-sky-600/30 shrink-0">
          <i data-lucide="bus" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h4 id="floatBusPlate" class="font-bold text-white text-sm">--</h4>
            <span id="floatLivePill" class="px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">Live Running</span>
          </div>
          <p id="floatTelemetry" class="text-xs text-slate-400 font-medium mt-0.5">Speed: 0.0 km/h</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleBottomSheet()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1">
          <i data-lucide="git-commit" class="w-3.5 h-3.5"></i>
          <span>Track</span>
        </button>
        <button onclick="recenterMap()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition">
          <i data-lucide="crosshair" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- WIMT-Style Sliding Bottom Sheet -->
  <div id="bottomSheet" class="bottom-sheet absolute bottom-0 left-0 right-0 h-[62vh] bg-[#111722] border-t-2 border-sky-500 rounded-t-3xl shadow-2xl z-30 flex flex-col">
    
    <!-- Drag Handle & Status Header -->
    <div class="p-3 flex items-center justify-between cursor-pointer bg-[#1a2232] rounded-t-3xl border-b border-slate-800" onclick="toggleBottomSheet()">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>
        <span id="sheetTitleText" class="text-xs font-bold text-slate-200 uppercase tracking-wider">Live Route Track</span>
      </div>
      <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto"></div>
      <div id="liveSpeedText" class="text-xs font-mono font-bold text-sky-400">0 km/h</div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 md:grid-cols-3 flex-1 overflow-hidden bg-[#111722]">
      
      <!-- Left Column: Available Buses List (WIMT Style) -->
      <div id="busesListContainer" class="p-3 overflow-y-auto border-r border-slate-800 space-y-2.5 bg-[#141b28] custom-scrollbar"></div>

      <!-- Right Column: WIMT Vertical Line Diagram -->
      <div class="md:col-span-2 flex flex-col overflow-hidden bg-[#111722] relative">
        
        <!-- Action Header -->
        <div id="scheduleToolbar" class="p-2.5 px-4 bg-[#1a2232] border-b border-slate-800 flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 text-slate-400 font-semibold">
            <span>Arrival</span>
            <span class="mx-6">Station / Distance</span>
            <span class="ml-auto">Departure</span>
          </div>
          <button id="btnTrackAction" onclick="toggleTrackingAction()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-1.5 rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5 active:scale-95">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span id="btnTrackActionText">Track Bus</span>
          </button>
        </div>

        <!-- Vertical Stations Track Container -->
        <div id="wimtTrackContainer" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-0 relative">
          <!-- Dynamically populated vertical stations list -->
        </div>

      </div>
    </div>
  </div>

  <!-- Route Data Scripts -->
  <script src="route/Blue-Yellow Buses (Private)/77a(nobata).js"></script>
  <script src="route/Blue-Yellow Buses (Private)/77a.js"></script>
  <script src="route/mini series/s-126(bata mini).js"></script>

  <!-- Application Engine -->
  <script src="app.js"></script>
</body>
</html>
