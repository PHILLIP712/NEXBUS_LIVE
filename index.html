<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXBUS_LIVE - Live Bus Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 min-h-screen relative overflow-hidden font-sans antialiased text-slate-800">

  <!-- Interactive Leaflet Map -->
  <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

  <!-- Top Search & Status Header -->
  <header class="relative z-20 w-full pt-4 px-4 flex flex-col items-center gap-2 pointer-events-none">
    
    <!-- Active Trip Banner -->
    <div id="activeTripBar" class="hidden pointer-events-auto flex items-center justify-between w-full max-w-2xl bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-xl border border-slate-200 text-xs transition-all duration-300">
      <div class="flex items-center gap-2">
        <span class="text-slate-500 font-bold">ACTIVE TRIP:</span>
        <span id="currentDirectionLabel" class="text-sky-600 font-extrabold text-sm">--</span>
      </div>
      <span id="connBadge" class="px-2.5 py-0.5 rounded-full font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Connecting...</span>
    </div>

    <!-- Search Controls -->
    <div class="pointer-events-auto w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-100 p-3 transition-all duration-200">
      <div class="flex flex-col sm:flex-row items-stretch gap-2 relative">
        
        <!-- Pickup Input -->
        <div class="relative w-full">
          <div class="flex items-center bg-slate-50 hover:bg-slate-100/80 focus-within:bg-white rounded-xl border border-slate-200 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-100 transition-all">
            <div class="pl-3.5 pr-2 py-3 flex items-center text-emerald-600">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </div>
            <input
              id="pickup-input"
              type="text"
              autocomplete="off"
              placeholder="Boarding / Pickup Stop"
              class="w-full bg-transparent py-2.5 text-sm text-slate-800 placeholder-slate-400 font-medium focus:outline-none"
            />
            <button id="pickup-clear" onclick="clearInput('pickup')" class="hidden pr-3 text-slate-400 hover:text-slate-600">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <ul id="pickup-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-56 overflow-y-auto custom-scrollbar z-50 divide-y divide-slate-100"></ul>
        </div>

        <!-- Arrow Divider -->
        <div class="hidden sm:flex items-center justify-center text-slate-400 px-1">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </div>

        <!-- Destination Input -->
        <div class="relative w-full">
          <div class="flex items-center bg-slate-50 hover:bg-slate-100/80 focus-within:bg-white rounded-xl border border-slate-200 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
            <div class="pl-3.5 pr-2 py-3 flex items-center text-indigo-600">
              <i data-lucide="navigation" class="w-4 h-4"></i>
            </div>
            <input
              id="dest-input"
              type="text"
              autocomplete="off"
              placeholder="Deboarding / Destination"
              class="w-full bg-transparent py-2.5 text-sm text-slate-800 placeholder-slate-400 font-medium focus:outline-none"
            />
            <button id="dest-clear" onclick="clearInput('dest')" class="hidden pr-3 text-slate-400 hover:text-slate-600">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <ul id="dest-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-56 overflow-y-auto custom-scrollbar z-50 divide-y divide-slate-100"></ul>
        </div>

        <!-- Search Button -->
        <button onclick="handleSearchClick()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-600/20 shrink-0 transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Search</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Live Bus Status Floating Card -->
  <div id="floatingBusCard" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-full max-w-md px-4 pointer-events-none transition-all duration-300">
    <div class="pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 p-4 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="toggleBottomSheet()">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shadow-md shadow-emerald-500/20 shrink-0">
          <i data-lucide="bus" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h4 id="floatBusPlate" class="font-bold text-slate-900 text-sm">--</h4>
            <span id="floatLivePill" class="px-1.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 border border-emerald-200">Live</span>
          </div>
          <p id="floatTelemetry" class="text-xs text-slate-500 font-medium mt-0.5">Speed: 0.0 km/h</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleBottomSheet()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 transition flex items-center gap-1">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span>Buses</span>
        </button>
        <button onclick="recenterMap()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl border border-slate-200 transition">
          <i data-lucide="crosshair" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Sliding Bottom Sheet Drawer -->
  <div id="bottomSheet" class="bottom-sheet absolute bottom-0 left-0 right-0 h-[50vh] bg-white border-t-2 border-emerald-500 rounded-t-3xl shadow-2xl z-30 flex flex-col">
    <div class="p-2.5 flex flex-col items-center cursor-pointer bg-slate-50 rounded-t-3xl border-b border-slate-200" onclick="toggleBottomSheet()">
      <div class="w-10 h-1 bg-slate-300 rounded-full mb-1"></div>
      <div id="sheetTitleText" class="text-xs font-bold text-slate-700 uppercase tracking-wider">Available Buses & Route Schedule</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 flex-1 overflow-hidden bg-white">
      <!-- Buses List -->
      <div id="busesListContainer" class="p-3 overflow-y-auto border-r border-slate-200 space-y-2 bg-slate-50/50"></div>

      <!-- Stop Schedule Column -->
      <div class="md:col-span-2 flex flex-col overflow-hidden bg-white relative">
        <div id="scheduleToolbar" class="p-2.5 px-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">Live Stop Timeline</span>
          <button id="btnTrackAction" onclick="toggleTrackingAction()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5 active:scale-95">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span id="btnTrackActionText">Confirm Route & Track</span>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-700 sticky top-0 border-b border-slate-200 shadow-sm z-10">
                <th class="p-2.5 pl-4 font-bold">#</th>
                <th class="p-2.5 font-bold">Stop Name</th>
                <th class="p-2.5 font-bold">Road Dist</th>
                <th class="p-2.5 font-bold">Stops Left</th>
                <th class="p-2.5 pr-4 font-bold">Live ETA</th>
              </tr>
            </thead>
            <tbody id="stopsTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Route Data Files -->
  <script src="route/Blue-Yellow Buses (Private)/77a(nobata).js"></script>
  <script src="route/Blue-Yellow Buses (Private)/77a.js"></script>
  <script src="route/mini series/s-126(bata mini).js"></script>

  <!-- Application Engine -->
  <script src="app.js"></script>
</body>
</html>
